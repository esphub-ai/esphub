<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#edeee6" />
    <title>ESP Hub · Device operations</title>
    <style>
      @font-face {
        font-family: Instrument;
        src: url(/instrument-b24f18125848.ttf);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: #f5f5ef;
        color: #172b25;
        font:
          16px Instrument,
          Arial,
          sans-serif;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a.button,
      select {
        cursor: pointer;
      }
      button,
      .button {
        border: 1px solid #b4c0b6;
        border-radius: 5px;
        padding: 10px 15px;
        color: #18352b;
        background: transparent;
        font-weight: 650;
      }
      button:hover,
      .button:hover {
        background: #e3e9dc;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .primary,
      .button.primary {
        background: #214d3b;
        border-color: #214d3b;
        color: white;
      }
      .primary:hover,
      .button.primary:hover {
        background: #153e2d;
      }
      .accent {
        color: #367659;
      }
      header {
        height: 76px;
        background: #f8f8f2;
        border-bottom: 1px solid #cbd3c8;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 max(5vw, calc((100vw - 1230px) / 2));
        gap: 30px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
        font-size: 24px;
        font-weight: 790;
        letter-spacing: -1.5px;
      }
      .mark {
        display: inline-grid;
        grid-template-columns: repeat(3, 6px);
        grid-template-rows: repeat(3, 6px);
        gap: 2px;
        transform: skewY(-10deg);
      }
      .mark i {
        background: #286044;
      }
      .mark i:nth-child(3),
      .mark i:nth-child(7) {
        background: transparent;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 26px;
        font-size: 14px;
        font-weight: 600;
      }
      .nav a:hover {
        color: #437a53;
      }
      .mono,
      .kicker,
      .tag,
      code,
      pre,
      .console,
      input.cmd {
        font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      }
      .kicker,
      .tag {
        font-size: 11px;
        letter-spacing: 1.35px;
      }
      .kicker {
        color: #42634e;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .kicker:before {
        content: "";
        width: 23px;
        height: 2px;
        background: #6f9f74;
      }
      .wrap {
        max-width: 1350px;
        margin: auto;
        padding: 0 5vw;
      }
      .hero {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5.8%;
        padding: 56px 0 46px;
        align-items: center;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(55px, 6.1vw, 92px);
        line-height: 0.96;
        letter-spacing: -0.071em;
        font-weight: 660;
        margin: 24px 0;
      }
      .lead {
        max-width: 450px;
        color: #4f6157;
        font-size: 18px;
        line-height: 1.55;
      }
      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 27px;
      }
      .actions .button,
      .actions button {
        padding: 13px 19px;
      }
      .art {
        position: relative;
        min-height: 350px;
        aspect-ratio: 1.38;
        overflow: hidden;
        border: 1px solid #325343;
        border-radius: 8px;
        background-color: #152e25;
        background-image:
          linear-gradient(#c0dcc013 1px, transparent 1px),
          linear-gradient(90deg, #c0dcc013 1px, transparent 1px),
          radial-gradient(ellipse at 45% 45%, #426648, transparent 65%);
        background-size:
          26px 26px,
          26px 26px,
          auto;
        color: #c9dfb6;
      }
      .art img {
        position: absolute;
        width: 72%;
        height: 78%;
        object-fit: contain;
        left: 14%;
        top: 10%;
        filter: drop-shadow(10px 21px 14px #08160f9c);
      }
      .art .meta {
        position: absolute;
        top: 17px;
        left: 18px;
        right: 17px;
        display: flex;
        justify-content: space-between;
      }
      .meta,
      .caption {
        font:
          10px ui-monospace,
          monospace;
        letter-spacing: 1.5px;
      }
      .caption {
        position: absolute;
        left: 18px;
        bottom: 18px;
      }
      .art .cross {
        position: absolute;
        bottom: 13px;
        right: 17px;
        font: 22px monospace;
        color: #9bb78f;
      }
      .halo {
        width: 73%;
        height: 74%;
        left: 14%;
        top: 13%;
        border: 1px dashed #b0c4a84d;
        position: absolute;
        border-radius: 50%;
        transform: rotate(-15deg);
      }
      .strip {
        border-top: 1px solid #ccd3c6;
        border-bottom: 1px solid #ccd3c6;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 18px 0;
        color: #516352;
        font:
          12px ui-monospace,
          monospace;
      }
      .dot {
        display: inline-block;
        border-radius: 50%;
        width: 8px;
        height: 8px;
        background: #629c60;
        margin-right: 7px;
      }
      .dash {
        padding: 42px 0 70px;
      }
      .sectionhead,
      .line,
      .toolbar,
      .bar,
      .cardtitle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }
      .sectionhead {
        margin-bottom: 22px;
      }
      .sectionhead h2,
      h2 {
        font-size: clamp(30px, 3vw, 46px);
        font-weight: 620;
        letter-spacing: -0.055em;
      }
      .sectionhead small,
      .muted {
        color: #5c695f;
      }
      .board {
        border: 1px solid #c1cbbc;
        background: #fbfcf7;
        border-radius: 8px;
        overflow: hidden;
      }
      .bar {
        padding: 13px 20px;
        background: #e9ede2;
        border-bottom: 1px solid #c1cbbc;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        font-size: 10px;
        border: 1px solid #bdcab6;
        border-radius: 3px;
        padding: 5px 7px;
        color: #4c6450;
        white-space: nowrap;
      }
      .device {
        display: flex;
        align-items: center;
        text-align: left;
        gap: 15px;
        padding: 17px 21px;
        width: 100%;
        border: 0;
        border-bottom: 1px solid #dde2d8;
        border-radius: 0;
      }
      .device:last-child {
        border-bottom: 0;
      }
      .device .icon {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        background: #e9eee3;
        border: 1px solid #cbd7c4;
        border-radius: 6px;
        font: 19px monospace;
      }
      .device .desc {
        flex: 1;
      }
      .device b,
      .device small {
        display: block;
      }
      .device small {
        font-weight: 400;
        color: #657265;
        margin-top: 3px;
      }
      .mini {
        font:
          12px ui-monospace,
          monospace;
        color: #486049;
      }
      .app {
        padding: 42px 0 70px;
        min-height: 72vh;
      }
      .crumb {
        font:
          12px ui-monospace,
          monospace;
        color: #607065;
        display: inline-block;
        margin-bottom: 18px;
      }
      .toolbar {
        align-items: flex-end;
        margin-bottom: 24px;
      }
      .toolbar h1,
      .docs h1 {
        font-size: clamp(42px, 5vw, 64px);
        margin: 10px 0;
      }
      .tabs {
        display: flex;
        gap: 6px;
        border-bottom: 1px solid #bec9bb;
        margin: 24px 0;
        overflow: auto;
      }
      .tabs button {
        border: 0;
        border-radius: 0;
        padding: 13px 16px;
        color: #546855;
      }
      .tabs .active {
        border-bottom: 3px solid #286045;
        color: #183c2a;
      }
      .columns {
        display: grid;
        grid-template-columns: minmax(0, 1.85fr) minmax(235px, 1fr);
        gap: 18px;
      }
      .panel {
        border: 1px solid #c3cdbf;
        background: #fafbf5;
        border-radius: 7px;
        padding: 20px;
        min-width: 0;
      }
      .panel h3 {
        font-size: 21px;
        margin-bottom: 13px;
        letter-spacing: -0.035em;
      }
      .console {
        background: #10271f;
        color: #d7e8cb;
        border-radius: 7px;
        overflow: hidden;
      }
      .termhead,
      .inputrow {
        padding: 14px 17px;
        display: flex;
        gap: 10px;
        align-items: center;
        border-bottom: 1px solid #395044;
      }
      .termhead {
        justify-content: space-between;
        font-size: 12px;
        color: #bccfb9;
      }
      .logs {
        padding: 15px 18px;
        height: 260px;
        overflow: auto;
        font-size: 13px;
        line-height: 1.7;
        overflow-wrap: anywhere;
      }
      .logs time {
        color: #9bb89c;
      }
      .logs strong {
        color: #c4ec9c;
      }
      .inputrow {
        border-top: 1px solid #395044;
        border-bottom: 0;
      }
      .cmd {
        color: #eef6e4;
        background: transparent;
        border: 0;
        outline: none;
        flex: 1;
        min-width: 0;
      }
      .cmd::placeholder {
        color: #a4b59f;
      }
      .inputrow button {
        background: #d3e7bb;
        color: #203d26;
        padding: 6px 13px;
        border: 0;
      }
      .data {
        font:
          13px/1.65 ui-monospace,
          monospace;
        word-break: break-word;
      }
      .kv {
        padding: 10px 0;
        border-bottom: 1px solid #dce2d6;
      }
      .cursor-value {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      .kv:last-child {
        border-bottom: none;
      }
      .kv small {
        display: block;
        color: #637363;
        margin-bottom: 3px;
      }
      .guide {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin: 15px 0 28px;
      }
      .guide .panel p,
      .doccopy {
        line-height: 1.6;
        color: #4e5e51;
      }
      .docs {
        max-width: 1000px;
      }
      .docs h2 {
        font-size: 26px;
        margin: 29px 0 10px;
      }
      .docs ul,
      .docs ol {
        line-height: 1.7;
        padding-left: 24px;
      }
      .docs pre,
      pre {
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #173326;
        color: #ddedcc;
        border-radius: 5px;
        padding: 15px;
        font-size: 13px;
        line-height: 1.6;
      }
      .docs table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      .docs td,
      .docs th {
        border-bottom: 1px solid #cbd4c6;
        padding: 10px;
        text-align: left;
      }
      .docs td:first-child {
        font-family: monospace;
      }
      .chip {
        display: inline-block;
        color: #3c6043;
        background: #e6eddf;
        border-radius: 4px;
        padding: 5px 9px;
        font: 12px monospace;
      }
      .field {
        display: block;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #b0c1ae;
        border-radius: 4px;
        background: white;
        color: #1d3427;
      }
      .flex {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      dialog {
        width: min(480px, 92vw);
        border: 1px solid #abc0ad;
        border-radius: 9px;
        background: #f8faf2;
        color: #183b29;
        padding: 25px;
      }
      dialog::backdrop {
        background: #09251abc;
      }
      dialog h2 {
        font-size: 26px;
        margin-bottom: 16px;
      }
      dialog label {
        display: block;
        margin: 14px 0;
      }
      dialog .field {
        margin-top: 6px;
      }
      footer {
        border-top: 1px solid #c3cebd;
        padding: 23px 5vw;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #607060;
        font-size: 12px;
      }
      .notice {
        color: #5e6e60;
        line-height: 1.5;
        font-size: 14px;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #183e2e;
        color: white;
        border-radius: 5px;
        padding: 12px 18px;
        z-index: 9;
      }
      .empty {
        padding: 26px;
      }
      .hide {
        display: none;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #67a578;
        outline-offset: 2px;
      }
      @media (max-width: 780px) {
        header {
          padding: 0 5vw;
          height: 64px;
          gap: 9px;
        }
        .nav {
          gap: 12px;
        }
        .nav .home-link {
          display: none;
        }
        .hero {
          grid-template-columns: 1fr;
          gap: 24px;
          padding: 32px 0;
        }
        .hero h1 {
          font-size: 62px;
        }
        .art {
          min-height: 240px;
          max-height: 310px;
          aspect-ratio: auto;
        }
        .guide,
        .columns {
          grid-template-columns: 1fr;
        }
        .strip {
          flex-wrap: wrap;
        }
        .toolbar {
          align-items: flex-start;
          flex-wrap: wrap;
        }
        .sectionhead {
          flex-wrap: wrap;
        }
        .device {
          padding: 13px;
        }
        .device .tag {
          display: none;
        }
        .dash {
          padding-top: 26px;
        }
        .nav .button {
          padding: 8px;
        }
        .wrap {
          padding: 0 5vw;
        }
        .brand {
          font-size: 21px;
        }
      }
      @media (max-width: 430px) {
        .nav {
          gap: 8px;
          font-size: 12px;
        }
        .hero h1 {
          font-size: 51px;
        }
        .nav .doc-link {
          display: none;
        }
        .strip {
          font-size: 10px;
        }
        .app {
          padding-top: 25px;
        }
        .sectionhead h2 {
          font-size: 29px;
        }
        .art {
          min-height: 230px;
        }
        .tabs button {
          padding: 11px 9px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/"
        ><span class="mark" aria-hidden="true"
          ><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span
        >ESP Hub</a
      >
      <nav class="nav">
        <a class="home-link" href="/devices">Devices</a
        ><a class="doc-link" href="/setup">USB setup</a
        ><a href="/mcp">MCP docs</a
        ><a class="button primary" href="/devices">Open console ↗</a>
      </nav>
    </header>
    <main class="wrap" id="main"></main>
    <footer>
      <span>ESP Hub · Device operations</span
      ><a href="/streams">UART stream protocol ↗</a>
    </footer>
    <dialog id="dialog"></dialog>
    <div id="toast" class="toast hide" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
