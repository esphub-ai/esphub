name: Build a shared EspHub bootloader
on:
  workflow_call:
    inputs:
      container: {type: string, required: true}
      variant: {type: string, required: true}
      fingerprint: {type: string, required: true}
      version: {type: string, required: true}
permissions: {contents: read}
concurrency:
  group: bl-${{ github.ref }}-${{ inputs.variant }}-${{ inputs.fingerprint }}
  cancel-in-progress: false
env:
  IDF_IMAGE: ${{ inputs.container }}
  VARIANT: ${{ inputs.variant }}
  VERSION: ${{ inputs.version }}
  TAG: bl-${{ inputs.variant }}-${{ inputs.fingerprint }}
  GH_TOKEN: ${{ github.token }}
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    outputs:
      published: ${{ steps.published.outputs.found }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Fetch the published build for these inputs
        id: published
        shell: bash
        run: |
          set -euo pipefail
          if receipt=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1); then
            jq -e '.draft == false and .prerelease == false' <<< "$receipt"
            gh release download "$TAG" -p bootloader.tar.gz -p bootloader.tar.gz.sha256
            sha256sum -c bootloader.tar.gz.sha256
            mkdir shared-bl
            tar -xzf bootloader.tar.gz -C shared-bl
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [[ "$receipt" != *"(HTTP 404)"* ]]; then
            printf '%s\n' "$receipt" >&2
            exit 1
          fi
      - name: Compile the shared binaries
        if: steps.published.outputs.found != 'true'
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e VARIANT -e VERSION -e GITHUB_SHA \
            "$IDF_IMAGE" bash scripts/build-bootloader.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bl-${{ inputs.variant }}
          path: shared-bl/
          if-no-files-found: error
  publish:
    needs: build
    if: needs.build.outputs.published != 'true' && github.repository == 'okou-ai/esphub' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bl-${{ inputs.variant }}
          path: shared-bl
      - name: Publish the shared build without executing source code
        run: |
          tar -czf bootloader.tar.gz -C shared-bl .
          sha256sum bootloader.tar.gz > bootloader.tar.gz.sha256
          gh release create "$TAG" bootloader.tar.gz bootloader.tar.gz.sha256 --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest=false --title "$VARIANT $VERSION" \
            --notes "Build inputs: ${{ inputs.fingerprint }}"
