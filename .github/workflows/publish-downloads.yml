name: Publish launcher downloads
on:
  workflow_run:
    workflows: ['Launcher release']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: launcher-downloads, cancel-in-progress: false}
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Mirror latest verified release to R2
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/ensure-bucket.mjs
          gh release download --pattern '*' --dir "$RUNNER_TEMP/launcher"
          node scripts/publish-firmware.mjs "$RUNNER_TEMP/launcher"
