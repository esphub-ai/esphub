name: Production
on:
  push:
    branches: [main]
    paths: ['services/**', 'migrations/**', 'shared/**', 'tests/**', 'package*.json', 'scripts/*.mjs', '.github/workflows/production.yml']
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: esphub}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/esphub
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/esphub
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y mosquitto mosquitto-clients pkg-config libcjson-dev
      - run: npm run migrate && npm run migrate
      - run: node scripts/seed-catalog.mjs
      - run: node scripts/migrate-board-gallery.mjs --local
      - run: npm test && npm run build && node scripts/local-e2e.mjs
      - run: npx wrangler deploy --dry-run -c services/api/wrangler.jsonc && npx wrangler deploy --dry-run -c services/web/wrangler.jsonc
  deploy:
    if: github.repository == 'okou-ai/esphub' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    concurrency: {group: esphub-production, cancel-in-progress: false}
    environment: production
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      IOT_RELAY_SECRET: ${{ secrets.IOT_RELAY_SECRET }}
      IOT_ACCOUNT_ID: ${{ vars.IOT_ACCOUNT_ID }}
      IOT_DATA_ENDPOINT: ${{ vars.IOT_DATA_ENDPOINT }}
      IOT_ACCESS_KEY_ID: ${{ secrets.IOT_ACCESS_KEY_ID }}
      IOT_SECRET_ACCESS_KEY: ${{ secrets.IOT_SECRET_ACCESS_KEY }}
      RUNTIME_DB_PASSWORD: ${{ secrets.RUNTIME_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci && npm run build
      - name: Check production credentials
        run: |
          for var in IOT_RELAY_SECRET IOT_ACCOUNT_ID IOT_DATA_ENDPOINT IOT_ACCESS_KEY_ID IOT_SECRET_ACCESS_KEY CLERK_SECRET_KEY MIGRATION_DATABASE_URL RUNTIME_DB_PASSWORD CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!var}" ]; then echo "::error::Missing $var"; exit 1; fi
          done
          test "${#IOT_RELAY_SECRET}" -ge 32
      - name: Check Clerk production OAuth configuration
        run: |
          curl -fsS --retry 3 https://clerk.esphub.ai/.well-known/oauth-authorization-server | jq -e '.issuer == "https://clerk.esphub.ai" and .client_id_metadata_document_supported == true and (has("registration_endpoint") | not) and (.scopes_supported | contains(["devices:read","devices:write"]))'
      - name: Ensure production storage buckets exist
        run: |
          node scripts/ensure-bucket.mjs esphub-production
          node scripts/ensure-bucket.mjs esphub-firmware
      - name: Migrate the production database
        run: npm run migrate
      # The esphub-firmware publisher owns the board catalog and release index.
      - name: Migrate the original gallery
        run: node scripts/migrate-board-gallery.mjs --remote
      - name: Deploy API and device broker
        run: |
          umask 077
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          node scripts/runtime-role.mjs "$secret_file"
          npx wrangler deploy -c services/api/wrangler.jsonc --secrets-file "$secret_file"
      - name: Deploy website and management console
        run: npx wrangler deploy -c services/web/wrangler.jsonc
      - name: Smoke test production
        run: |
          curl --fail --retry 5 --retry-all-errors https://api.esphub.ai/health | jq -e '.ok == true'
          for host in esphub.ai www.esphub.ai app.esphub.ai; do
            curl -fsSL --retry 5 --retry-all-errors "https://$host/" | grep -q 'EspHub'
          done
          photo_url=$(curl -fsS --retry 5 --retry-all-errors https://esphub.ai/backend/boards/gallery | jq -er 'first(.[] | .image_url | select(startswith("https://cdn.esphub.ai/boards/")))')
          curl -fsS --retry 8 --retry-all-errors --retry-max-time 180 "$photo_url?width=80" -o "$RUNNER_TEMP/esphub-thumbnail.webp"
          file --brief "$RUNNER_TEMP/esphub-thumbnail.webp" | grep -q 'Web/P image'
          curl -fsS --retry 5 --retry-all-errors https://api.esphub.ai/.well-known/oauth-protected-resource/mcp | jq -e '.resource == "https://api.esphub.ai/mcp" and .authorization_servers == ["https://clerk.esphub.ai"] and (.scopes_supported | contains(["devices:read","devices:write"]))'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Bearer esh_key_invalidtestkey' https://api.esphub.ai/mcp)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' https://app.esphub.ai/backend/auth/me)" = 401
      - name: Retire database access to the former authentication tables
        run: |
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'REVOKE ALL PRIVILEGES ON esphub.credentials, esphub.challenges, esphub.access_tokens FROM esphub_runtime'
