name: Launcher release
on:
  push:
    branches: [main]
    paths: ['firmware/**', 'scripts/package-launcher.py', '.github/workflows/launcher.yml']
  pull_request:
    paths: ['firmware/**', 'scripts/package-launcher.py', '.github/workflows/launcher.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        board: [paper-color, stopwatch]
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Build board-specific launcher
        shell: bash
        working-directory: firmware/launcher
        env:
          BOARD: ${{ matrix.board }}
        run: |
          set -eo pipefail
          source "$IDF_PATH/export.sh"
          idf.py -DIDF_TARGET=esp32s3 -DPROJECT_VER="1.0.${GITHUB_RUN_NUMBER}" \
            -DSDKCONFIG_DEFAULTS="../sdkconfig.common;sdkconfig.defaults;../boards/${BOARD}.defaults" build
          python ../../scripts/package-launcher.py "$BOARD" "1.0.${GITHUB_RUN_NUMBER}"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.board }}
          path: dist/
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish both board packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="launcher-v1.0.${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "$tag" --notes 'Board-specific USB installation kits, launcher-only OTA binaries and SHA-256 manifests.'
          fi
