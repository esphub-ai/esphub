name: USB setup kits
on:
  push:
    branches: [main]
    paths: ['shared/setup-release.json']
  pull_request:
    paths: ['shared/setup-release.json', 'scripts/package-setup.py', '.github/workflows/setup.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble from released launcher and runtime images
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          launcher=$(jq -r .launcher_version shared/setup-release.json)
          runtime=$(jq -r .runtime_version shared/setup-release.json)
          mkdir dist
          for board in stopwatch paper-color; do
            mkdir "$board"
            base="esphub-$board-esp32s3-$launcher"
            app="esphub-$board-micropython-$runtime"
            if [[ "$board" == stopwatch ]]; then
              kit="$base-fresh-usb.zip"
              gh release download "launcher-v$launcher" -p "$kit" -p "$base-fresh-usb.sha256" -D "$board"
              (cd "$board" && sha256sum -c "$base-fresh-usb.sha256")
            else
              kit="$base-usb.zip"
              gh release download "launcher-v$launcher" -p "$kit" -p "$base.json" -D "$board"
              jq -er --arg name "$kit" --arg board "$board" 'select(.board == $board and .usb.file == $name) | .usb.sha256 + "  " + .usb.file' "$board/$base.json" > "$board/checksum"
              (cd "$board" && sha256sum -c checksum)
            fi
            gh release download "micropython-v$runtime" -p "$app.bin" -p "$app.sha256" -D "$board"
            (cd "$board" && sha256sum -c "$app.sha256")
            python scripts/package-setup.py "$board" "$board/$kit" "$board/$app.bin" dist
          done
      - uses: actions/upload-artifact@v4
        with: {name: setup-kits, path: dist/}
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: assemble
    permissions: {contents: write}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: setup-kits, path: dist}
      - name: Publish first-time USB kits
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          tag="setup-v$(jq -r .version shared/setup-release.json)"
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --latest=false --title "$tag" --notes "Flash once over USB to install the matching launcher and MicroPython runtime. The manifest lists both versions."
