name: Assemble EspHub USB kit
description: Combine the selected bootloader and runtime for this board.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        mkdir -p components/{bootloader,micropython} dist
        base="esphub-$BOARD-$CHIP-$BOOTLOADER_VERSION"
        kit="$base-usb.zip"
        app="esphub-$BOARD-micropython-$MICROPYTHON_VERSION"
        manifest="$base.json"
        if [[ "$LOCAL_BOOTLOADER" == false ]]; then
          gh release download "$BOOTLOADER_TAG" -R "$GITHUB_REPOSITORY" -p "$kit" -p "$manifest" -D components/bootloader
        fi
        if [[ "$LOCAL_MICROPYTHON" == false ]]; then
          gh release download "$MICROPYTHON_TAG" -R "$GITHUB_REPOSITORY" -p "$app.bin" -p "$app.sha256" -D components/micropython
        fi
        jq -er --arg name "$kit" --arg board "$BOARD" 'select(.board == $board and .usb.file == $name) | .usb.sha256 + "  " + .usb.file' "components/bootloader/$manifest" > components/bootloader/checksum
        (cd components/bootloader && sha256sum -c checksum)
        (cd components/micropython && sha256sum -c "$app.sha256")
        python3 scripts/package-setup.py "$BOARD" "components/bootloader/$kit" "components/micropython/$app.bin" dist
