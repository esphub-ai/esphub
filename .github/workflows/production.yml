name: Production
on:
  push:
    branches: [main]
    paths-ignore: ['firmware/**','.github/workflows/launcher.yml','.github/workflows/runtime.yml','.github/workflows/setup.yml','scripts/package-launcher.py','scripts/package-setup.py','**/*.md']
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: esphub}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/esphub
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/esphub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run migrate && npm run migrate
      - run: npm test && npm run build && node scripts/local-e2e.mjs
      - run: npx wrangler deploy --dry-run -c services/api/wrangler.jsonc && npx wrangler deploy --dry-run -c services/web/wrangler.jsonc
  migrate:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Migrate production Neon database
        run: npm run migrate
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: migrate
    runs-on: ubuntu-latest
    concurrency: {group: esphub-production, cancel-in-progress: false}
    environment: production
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      RUNTIME_DB_PASSWORD: ${{ secrets.RUNTIME_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci && npm run build
      - name: Check production credentials
        run: |
          for var in CLERK_SECRET_KEY MIGRATION_DATABASE_URL RUNTIME_DB_PASSWORD CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!var}" ]; then echo "::error::Missing $var"; exit 1; fi
          done
      - name: Check Clerk production OAuth configuration
        run: |
          curl -fsS --retry 3 https://clerk.esphub.ai/.well-known/oauth-authorization-server | jq -e '.issuer == "https://clerk.esphub.ai" and .client_id_metadata_document_supported == true and (has("registration_endpoint") | not) and (.scopes_supported | contains(["devices:read","devices:write"]))'
      - name: Ensure production UART bucket exists
        run: node scripts/ensure-bucket.mjs
      - name: Check the first-time setup kits before switching the API
        run: |
          version=$(jq -r .version shared/setup-release.json)
          for board in stopwatch paper-color cardputer-adv; do
            curl -fsSL --retry 12 --retry-all-errors --retry-delay 5 "https://github.com/$GITHUB_REPOSITORY/releases/download/setup-v$version/esphub-$board-esp32s3-$version-setup.json" | jq -e --arg board "$board" --arg version "$version" '.board == $board and .version == $version and .runtime_size > 0'
          done
      - name: Deploy API and device broker
        run: |
          umask 077
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          node scripts/runtime-role.mjs "$secret_file"
          npx wrangler deploy -c services/api/wrangler.jsonc --secrets-file "$secret_file"
      - name: Deploy website and management console
        run: npx wrangler deploy -c services/web/wrangler.jsonc
      - name: Smoke test production
        run: |
          curl --fail --retry 5 --retry-all-errors https://api.esphub.ai/health | jq -e '.ok == true'
          for host in esphub.ai www.esphub.ai app.esphub.ai; do
            curl -fsSL --retry 5 --retry-all-errors "https://$host/" | grep -q 'EspHub'
          done
          curl -fsS --retry 5 --retry-all-errors https://api.esphub.ai/.well-known/oauth-protected-resource/mcp | jq -e '.resource == "https://api.esphub.ai/mcp" and .authorization_servers == ["https://clerk.esphub.ai"] and (.scopes_supported | contains(["devices:read","devices:write"]))'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Bearer esh_key_invalidtestkey' https://api.esphub.ai/mcp)" = 401
          curl -fsS https://app.esphub.ai/tools.json | jq -e '(map(.name)) as $tools | (["programs.publish","launcher.enter","ota.install"] - $tools | length == 0) and ($tools | index("programs.install") == null)'
          for board in paper-color stopwatch cardputer-adv; do
            curl -fsSL --retry 3 "https://api.esphub.ai/releases/$board/setup-manifest" | jq -e --arg board "$board" '.board == $board and (.sha256 | test("^[a-f0-9]{64}$")) and (.runtime_size > 0)'
          done
          curl -fsSL https://api.esphub.ai/releases/paper-color/manifest | jq -e '.board == "paper-color"'
          curl -fsSL https://api.esphub.ai/releases/stopwatch/manifest | jq -e '.board == "stopwatch"'
          test "$(curl -s -o /dev/null -w '%{http_code}' https://app.esphub.ai/backend/auth/me)" = 401
      - name: Retire database access to the former authentication tables
        run: |
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'REVOKE ALL PRIVILEGES ON esphub.credentials, esphub.challenges, esphub.access_tokens FROM esphub_runtime'
