name: MicroPython release
on:
  push:
    branches: [main]
    paths: ['firmware/pyrt/**', '!firmware/pyrt/examples/**', '!firmware/pyrt/**/*.md', 'firmware/components/okou_agent/**', '.github/workflows/runtime.yml']
  pull_request:
    paths: ['firmware/pyrt/**', '!firmware/pyrt/examples/**', '!firmware/pyrt/**/*.md', 'firmware/components/okou_agent/**', '.github/workflows/runtime.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  runtime:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {board: paper-color, target: M5STACK_PaperColor}
          - {board: cardputer-adv, target: M5STACK_CardputerADV}
          - {board: stopwatch, target: M5STACK_StopWatch}
    steps:
      - uses: actions/checkout@v4
        with: {path: okl}
      - uses: actions/checkout@v4
        with:
          repository: m5stack/uiflow-micropython
          ref: a61a29409f09f1f4bebae05e15c4bd6dcc4956b6
          path: uiflow
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf quilt cmake ninja-build ccache \
            libffi-dev libssl-dev dfu-util libusb-1.0-0
      - name: Cache ESP-IDF v5.5.5
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            uiflow/esp-idf
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-idf-v5.5.5-py${{ steps.python.outputs.python-version }}
      - name: ESP-IDF v5.5.5
        working-directory: uiflow
        run: |
          source tools/ci.sh
          ci_esp32_idf555_setup
      - name: UIFlow submodules and patches
        working-directory: uiflow
        run: |
          source esp-idf/export.sh
          pip install future
          make -C m5stack submodules
          make -C m5stack patch
          make -C m5stack littlefs
      - name: Apply the esp-launcher overlay
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 okl/firmware/pyrt/apply_overlay.py uiflow okl/firmware ${{ matrix.target }} "$VERSION"
      - name: Build
        working-directory: uiflow
        run: |
          source esp-idf/export.sh
          make -C m5stack BOARD=${{ matrix.target }} build
      - name: Verify and package the board runtime
        run: |
          image="uiflow/m5stack/build-${{ matrix.target }}/micropython.bin"
          python3 -c 'import sys; assert open(sys.argv[1], "rb").read(340)[288:].startswith(("ESPHUB1/micropython/" + sys.argv[2] + "\0").encode())' "$image" "${{ matrix.board }}"
          test "$(stat -c %s "$image")" -le 4194304
          grep -Fx 'CONFIG_OKOU_BOARD_PROFILE="${{ matrix.board }}"' "uiflow/m5stack/build-${{ matrix.target }}/sdkconfig"
          mkdir out
          cp "$image" "out/esphub-${{ matrix.board }}-micropython-$VERSION.bin"
          cd out && sha256sum *.bin > "esphub-${{ matrix.board }}-micropython-$VERSION.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.board }}
          path: out/
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: runtime
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'runtime-*', path: dist, merge-multiple: true}
      - name: Publish MicroPython images
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          tag="micropython-v1.0.$GITHUB_RUN_NUMBER"
          gh release create "$tag" dist/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false --title "$tag" --notes "Board-specific ESP Hub MicroPython application images and SHA-256 checksums."
