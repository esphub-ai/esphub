name: Launcher release
on:
  push:
    branches: [main]
    paths: ['firmware/**', 'scripts/package-launcher.py', 'scripts/package-setup.py', '.github/workflows/launcher.yml']
  pull_request:
    paths: ['firmware/**', 'scripts/package-launcher.py', 'scripts/package-setup.py', '.github/workflows/launcher.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pin-source:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - name: Reserve the build's source tag while the push is current
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="launcher-v1.0.${GITHUB_RUN_NUMBER}"
          ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"
          if existing="$(gh api "$ref" --jq .object.sha 2>/dev/null)"; then
            test "$existing" = "$GITHUB_SHA"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -X POST -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" --silent
          fi
  build:
    needs: pin-source
    strategy:
      fail-fast: false
      matrix:
        board: [paper-color, stopwatch]
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Build board-specific launcher
        shell: bash
        working-directory: firmware/launcher
        env:
          BOARD: ${{ matrix.board }}
        run: |
          set -eo pipefail
          source "$IDF_PATH/export.sh"
          idf.py -DIDF_TARGET=esp32s3 -DPROJECT_VER="1.0.${GITHUB_RUN_NUMBER}" \
            -DSDKCONFIG_DEFAULTS="../sdkconfig.common;sdkconfig.defaults;../boards/${BOARD}.defaults" build
          python ../../scripts/package-launcher.py "$BOARD" "1.0.${GITHUB_RUN_NUMBER}"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.board }}
          path: dist/
      - name: Build the fresh StopWatch partition layout
        if: matrix.board == 'stopwatch'
        shell: bash
        working-directory: firmware/launcher
        run: |
          set -eo pipefail
          source "$IDF_PATH/export.sh"
          sed 's|16mb-legacy.csv|16mb.csv|' ../boards/stopwatch.defaults > sdkconfig.setup.defaults
          idf.py -B build-setup -DIDF_TARGET=esp32s3 -DPROJECT_VER="1.0.${GITHUB_RUN_NUMBER}" \
            -DSDKCONFIG="$PWD/sdkconfig.setup" -DSDKCONFIG_DEFAULTS="../sdkconfig.common;sdkconfig.defaults;sdkconfig.setup.defaults" build
          python ../../scripts/package-launcher.py stopwatch "1.0.${GITHUB_RUN_NUMBER}" --setup-base
      - uses: actions/upload-artifact@v4
        if: matrix.board == 'stopwatch'
        with:
          name: setup-base-stopwatch
          path: setup-base/*-usb.zip
  runtime:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {board: paper-color, target: M5STACK_PaperColor}
          - {board: stopwatch, target: M5STACK_StopWatch}
    steps:
      - uses: actions/checkout@v4
        with: {path: okl}
      - uses: actions/checkout@v4
        with:
          repository: m5stack/uiflow-micropython
          ref: a61a29409f09f1f4bebae05e15c4bd6dcc4956b6
          path: uiflow
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf quilt cmake ninja-build ccache \
            libffi-dev libssl-dev dfu-util libusb-1.0-0
      - name: Cache ESP-IDF v5.5.5
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            uiflow/esp-idf
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-idf-v5.5.5-py${{ steps.python.outputs.python-version }}
      - name: ESP-IDF v5.5.5
        working-directory: uiflow
        run: |
          source tools/ci.sh
          ci_esp32_idf555_setup
      - name: UIFlow submodules and patches
        working-directory: uiflow
        run: |
          source esp-idf/export.sh
          pip install future
          make -C m5stack submodules
          make -C m5stack patch
          make -C m5stack littlefs
      - name: Apply the esp-launcher overlay
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 okl/firmware/pyrt/apply_overlay.py uiflow okl/firmware ${{ matrix.target }} "$VERSION"
      - name: Build
        working-directory: uiflow
        run: |
          source esp-idf/export.sh
          make -C m5stack BOARD=${{ matrix.target }} build
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.board }}
          path: uiflow/m5stack/build-${{ matrix.target }}/micropython.bin
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, runtime]
    concurrency: {group: esphub-launcher-release, cancel-in-progress: false}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble and verify both installation kits
        run: |
          mkdir dist
          cp artifacts/launcher-*/* dist/
          for board in stopwatch paper-color; do
            base="artifacts/launcher-$board"
            if [ "$board" = stopwatch ]; then base=artifacts/setup-base-stopwatch; fi
            python scripts/package-setup.py "$board" "1.0.${GITHUB_RUN_NUMBER}" "$base"/*-usb.zip "artifacts/runtime-$board/micropython.bin" dist
          done
      - name: Publish both board packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="launcher-v1.0.${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* -R "$GITHUB_REPOSITORY" --clobber
          else
            # A slow older board matrix can finish after a newer release.
            latest_tag="$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')"
            latest=true
            if [[ "$latest_tag" =~ ^launcher-v1\.0\.([0-9]+)$ ]] && (( BASH_REMATCH[1] > GITHUB_RUN_NUMBER )); then
              latest=false
            fi
            gh release create "$tag" dist/* -R "$GITHUB_REPOSITORY" --verify-tag --latest="$latest" --title "$tag" --notes 'Board-specific first-time setup kits with MicroPython, launcher-only USB and OTA images, and SHA-256 manifests.'
          fi
