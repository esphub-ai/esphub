name: Build ESP Hub launcher
description: Compile an ESP-IDF launcher and package its USB and OTA assets.
inputs:
  fresh_layout:
    description: Build the alternate first-install layout.
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: firmware/launcher
      env:
        FRESH_LAYOUT: ${{ inputs.fresh_layout }}
      run: |
        set -eo pipefail
        source "$IDF_PATH/export.sh"
        dir="../boards/$BOARD/launcher"
        defaults="../sdkconfig.common;sdkconfig.defaults;$dir/sdkconfig.defaults"
        args=()
        package=()
        if [[ "$FRESH_LAYOUT" == true ]]; then
          defaults+=";$dir/setup.defaults"
          args=(-B build-setup -DSDKCONFIG="$PWD/sdkconfig.setup")
          package=(--setup-base)
        fi
        idf.py "${args[@]}" -DIDF_TARGET="$CHIP" -DPROJECT_VER="$VERSION" \
          -DSDKCONFIG_DEFAULTS="$defaults" build
        python ../../scripts/package-launcher.py "$BOARD" "$VERSION" "${package[@]}"
