AWSTemplateFormatVersion: '2010-09-09'
Description: ESPHub MQTT wake subscriptions and backend IAM permissions
Resources:
  DevicePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: ESPHubDeviceWake
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:client/${!iot:Connection.Thing.ThingName}'
            Condition:
              Bool:
                iot:Connection.Thing.IsAttached: 'true'
          - Effect: Allow
            Action: iot:Subscribe
            Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/devices/${!iot:Connection.Thing.Attributes[deviceId]}/wake'
          - Effect: Allow
            Action: iot:Receive
            Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/devices/${!iot:Connection.Thing.Attributes[deviceId]}/wake'
  BackendPermissions:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iot:Publish
            Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/devices/*/wake'
          - Effect: Allow
            Action: iot:GetConnection
            Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:client/esphub-*'
          - Effect: Allow
            Action: [iot:CreateThing, iot:AttachThingPrincipal]
            Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/esphub-*'
          - Effect: Allow
            Action: iot:AttachPolicy
            Resource: !GetAtt DevicePolicy.Arn
          - Effect: Allow
            Action: [iot:UpdateCertificate, iot:DeleteCertificate]
            Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:cert/*'
          - Effect: Allow
            Action: iot:CreateCertificateFromCsr
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
Outputs:
  WorkerPolicyArn:
    Value: !Ref BackendPermissions
