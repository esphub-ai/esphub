name: Board firmware
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      board:
        description: Optional public board ID. Only unpublished changes are built.
        type: string
        required: false
      pr_number:
        description: PR CI requested by SDK version automation; never publishes.
        type: string
        required: false
permissions: {contents: read}
jobs:
  context:
    uses: ./.github/workflows/pr-ci-context.yml
    with: {pr_number: '${{ inputs.pr_number }}'}
  plan:
    needs: context
    runs-on: ubuntu-latest
    outputs:
      bootloaders: ${{ steps.plan.outputs.bootloaders }}
      boards: ${{ steps.plan.outputs.boards }}
    steps:
      - name: Reject a PR CI dispatch on main
        if: inputs.pr_number != ''
        run: test "$GITHUB_REF" != 'refs/heads/main'
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_CI_BASE_SHA: ${{ needs.context.outputs.base_sha }}
        run: node scripts/firmware-plan.mjs
  bootloader:
    needs: plan
    if: needs.plan.outputs.bootloaders != '[]'
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.plan.outputs.bootloaders) }}
    permissions: {contents: write}
    uses: ./.github/workflows/build-bootloader.yml
    with:
      container: ${{ matrix.build.container }}
      variant: ${{ matrix.build.variant }}
      fingerprint: ${{ matrix.build.fingerprint }}
      version: ${{ matrix.build.version }}
  board:
    needs: [plan, bootloader]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.bootloader.result != 'failure' && needs.plan.outputs.boards != '[]' }}
    name: ${{ matrix.profile.board }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.plan.outputs.boards) }}
    concurrency:
      group: firmware-${{ github.ref }}-${{ matrix.profile.board }}
      cancel-in-progress: false
    permissions: {contents: write}
    uses: ./.github/workflows/build-board.yml
    with:
      profile: ${{ toJSON(matrix.profile) }}
  check:
    name: Firmware
    needs: [context, plan, bootloader, board]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected firmware build to pass
        env:
          CONTEXT: ${{ needs.context.result }}
          PLAN: ${{ needs.plan.result }}
          BOOTLOADER: ${{ needs.bootloader.result }}
          BOARD: ${{ needs.board.result }}
        run: |
          test "$CONTEXT" = success
          test "$PLAN" = success
          for result in "$BOOTLOADER" "$BOARD"; do
            test "$result" = success || test "$result" = skipped || exit 1
          done
  sync-catalog:
    needs: [plan, board]
    if: ${{ !cancelled() && github.repository == 'okou-ai/esphub' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !inputs.pr_number && needs.plan.outputs.boards != '[]' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Sync published releases to the firmware catalog
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: node scripts/sync-board-releases.mjs
