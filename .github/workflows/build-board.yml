name: Build a board
on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
permissions: {contents: read}
env:
  BOARD: ${{ fromJSON(inputs.profile).board }}
  BOARD_DIR: ${{ fromJSON(inputs.profile).boardDir }}
  CHIP: ${{ fromJSON(inputs.profile).chip }}
jobs:
  reserve:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    if: github.repository == 'okou-ai/esphub' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Pin selected release tags to this source commit
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS: ${{ toJSON(fromJSON(inputs.profile).jobs) }}
        run: |
          set -euo pipefail
          for tag in $(jq -r '.[].tag' <<< "$JOBS"); do
            if sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
              test "$sha" = "$GITHUB_SHA"
            else
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -X POST -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" --silent
            fi
          done
  component:
    needs: reserve
    if: ${{ !cancelled() && needs.reserve.result != 'failure' && fromJSON(inputs.profile).components[0] != null }}
    name: ${{ matrix.task.kind }}
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(inputs.profile).components }}
    runs-on: ${{ matrix.task.runner }}
    container: ${{ matrix.task.container || null }}
    env:
      VERSION: ${{ matrix.task.version }}
      KIND: ${{ matrix.task.kind }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        if: matrix.task.kind == 'bootloader'
        with:
          name: bl-${{ fromJSON(inputs.profile).bootloader }}
          path: shared-bl
      - name: Assemble bootloader release for the board
        if: matrix.task.kind == 'bootloader'
        shell: bash
        run: |
          set -eo pipefail
          source "$IDF_PATH/export.sh"
          python scripts/package-board-bootloader.py "$BOARD" "$VERSION" "$BOARD_DIR"
      - name: Select the board's composite action
        if: matrix.task.kind != 'bootloader'
        shell: bash
        run: cp -R "$BOARD_DIR/$KIND" .board-task
      - uses: ./.board-task
        if: matrix.task.kind != 'bootloader'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BOARD }}-${{ matrix.task.kind }}
          path: dist/
          if-no-files-found: error
  kit:
    needs: [reserve, component]
    if: ${{ !cancelled() && needs.reserve.result != 'failure' && needs.component.result != 'failure' && fromJSON(inputs.profile).kit != null }}
    name: USB kit
    runs-on: ${{ fromJSON(inputs.profile).kit.runner }}
    container: ${{ fromJSON(inputs.profile).kit.container || null }}
    env:
      VERSION: ${{ fromJSON(inputs.profile).kit.version }}
      TAG: ${{ fromJSON(inputs.profile).kit.tag }}
      BOOTLOADER_VERSION: ${{ fromJSON(inputs.profile).kit.bootloader.version }}
      BOOTLOADER_TAG: ${{ fromJSON(inputs.profile).kit.bootloader.tag }}
      RUNTIME_VERSION: ${{ fromJSON(inputs.profile).kit.runtime.version }}
      RUNTIME_KIND: ${{ fromJSON(inputs.profile).kit.runtime_kind }}
      RUNTIME_TAG: ${{ fromJSON(inputs.profile).kit.runtime.tag }}
      LOCAL_BOOTLOADER: ${{ toJSON(fromJSON(inputs.profile).kit.local_bootloader) }}
      LOCAL_RUNTIME: ${{ toJSON(fromJSON(inputs.profile).kit.local_runtime) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        if: fromJSON(inputs.profile).kit.local_bootloader
        with:
          name: ${{ env.BOARD }}-bootloader
          path: components/bootloader
      - uses: actions/download-artifact@v4
        if: fromJSON(inputs.profile).kit.local_runtime
        with:
          name: ${{ env.BOARD }}-${{ env.RUNTIME_KIND }}
          path: components/runtime
      - name: Select the board's USB kit action
        shell: bash
        run: cp -R "$BOARD_DIR/setup" .board-task
      - uses: ./.board-task
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BOARD }}-setup
          path: dist/
          if-no-files-found: error
  publish:
    needs: [reserve, component, kit]
    if: ${{ !cancelled() && needs.reserve.result == 'success' && needs.component.result != 'failure' && needs.kit.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BOARD }}-*
          path: assets
      - name: Publish only the selected board's completed tasks
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS: ${{ toJSON(fromJSON(inputs.profile).jobs) }}
        run: |
          set -euo pipefail
          for kind in bootloader micropython native setup; do
            job=$(jq -c --arg kind "$kind" '.[] | select(.kind == $kind)' <<< "$JOBS")
            [[ -n "$job" ]] || continue
            tag=$(jq -r .tag <<< "$job")
            fingerprint=$(jq -r .fingerprint <<< "$job")
            dir="assets/$BOARD-$kind"
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft,body,assets > release.json 2>/dev/null; then
              jq -e --arg receipt "Build inputs: $fingerprint" '.isDraft == false and (.body | contains($receipt))' release.json
              diff <(find "$dir" -type f -printf '%f\n' | sort) <(jq -r '.assets[].name' release.json | sort)
            else
              gh release create "$tag" "$dir"/* -R "$GITHUB_REPOSITORY" --verify-tag --latest=false \
                --title "$tag" --notes "Build inputs: $fingerprint"
            fi
          done
